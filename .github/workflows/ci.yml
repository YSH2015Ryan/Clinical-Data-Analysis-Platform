name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install ".[dev]"
      - name: ruff
        run: ruff check app tests && ruff format --check app tests
      - name: mypy
        run: mypy
      - name: import-linter（分层纪律 docs/12 §1）
        run: lint-imports

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: cdap
          POSTGRES_PASSWORD: cdap
          POSTGRES_DB: cdap_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cdap"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://cdap:cdap@localhost:5432/cdap_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install ".[dev]"
      - name: 安装 Noto CJK 字体（PDF 中文嵌入测试，docs/10 §5；与 prod 镜像一致）
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: pytest + coverage
        run: coverage run -m pytest && coverage report

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: i18n/resource and component tests
        run: npm test
      - name: TypeScript and production build
        run: npm run build

  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        # 先升级 pip/setuptools：审计对象为全环境，预装版本含已知 CVE（见 docs/licenses-report.md §1）
        run: |
          pip install -U pip
          pip install ".[dev]" pip-audit pip-licenses "setuptools>=83.0.0"
      - name: 漏洞审计（豁免清单见 docs/licenses-report.md §1）
        run: >
          pip-audit
          --ignore-vuln PYSEC-2026-1845
          --ignore-vuln PYSEC-2026-161
          --ignore-vuln PYSEC-2026-248
          --ignore-vuln PYSEC-2026-249
          --ignore-vuln PYSEC-2026-2280
          --ignore-vuln PYSEC-2026-2281
      - name: 许可证审计（新增 GPL 即失败）
        run: |
          pip-licenses --from=mixed --with-system \
            | grep -iE 'GPL|AGPL' \
            | grep -vE 'LGPL|ecos|scikit-survival|rfc3987' \
            && exit 1 || echo "license check passed"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build --target prod backend/
      - name: Build frontend image
        run: docker build frontend/
