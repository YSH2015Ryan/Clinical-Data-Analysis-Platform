[build-system]
requires = ["setuptools>=83"]  # >=83：PYSEC-2026-3447 修复版
build-backend = "setuptools.build_meta"

[project]
name = "cdap-backend"
version = "0.1.0"
description = "Clinical Data Analysis Platform - Backend"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Web
    # 注：starlette CVE 修复（PYSEC-2026-161/248/249/2280/2281）仅在 1.x 线，而 fastapi 最新版仍 cap starlette<1.0。
    # 决策：跟随 fastapi 使用 starlette 0.x，5 个 CVE 在 CI pip-audit 中豁免（--ignore-vuln），
    # 缓解措施：Nginx 请求大小限制 + 上传白名单（docs/12 §2.5）；fastapi 迁移 starlette 1.x 后立即升级。
    "fastapi>=0.115",
    "uvicorn[standard]~=0.30",
    "pydantic~=2.8",
    "pydantic-settings~=2.5",
    "email-validator~=2.0",  # pydantic EmailStr 依赖（Apache-2.0）
    "python-multipart",
    "httpx~=0.27",
    # DB / 任务队列 / 存储
    "sqlalchemy~=2.0",
    "alembic~=1.13",
    "psycopg[binary]~=3.2",
    "redis~=5.0",
    "celery~=5.4",
    "minio~=7.2",
    # 安全（PyJWT 替代 python-jose：jose 拖入 ecdsa 且 PYSEC-2026-1325 无修复版；
    # bcrypt 直用替代 passlib：passlib 休眠且与 bcrypt>=4.1 不兼容）
    "pyjwt[crypto]~=2.10",
    "bcrypt~=4.2",
    "cryptography>=43.0",  # Fernet：admin_settings 敏感字段加密（T6.6；Apache-2.0/BSD）
    # 数据处理
    "pandas~=2.2",
    "openpyxl~=3.1",  # xlsx 解析（MIT）
    "numpy~=1.26",
    "scipy~=1.14",
    "pyarrow>=23.0.1",  # PYSEC-2026-113 修复版
    "charset-normalizer~=3.3",
    "pandera~=0.20",
    # ML（复用开源，不自研 —— docs/03）
    "scikit-learn~=1.5",
    "lifelines~=0.30",
    "scikit-survival~=0.24",
    "xgboost~=2.1",
    "lightgbm~=4.5",
    "catboost~=1.2",
    "pygam~=0.9",
    "statsmodels~=0.14",
    "shap~=0.46",
    "category-encoders~=2.6",
    "tableone~=0.9",
    # 预处理表达式沙箱（白名单求值，禁止 eval —— docs/06）
    "simpleeval~=1.0",
    # 报告
    "jinja2~=3.1",
    "weasyprint>=68.0",  # PYSEC-2026-2034 修复版；PYSEC-2026-3412 暂无修复，CI 持续监控
    "python-docx~=1.1",
    "matplotlib~=3.9",  # 报告 PNG 渲染（docs/10 §1 依赖清单；ChartAsset JSON 单数据源派生）
    # 日志
    "structlog~=24.4",
]

[project.optional-dependencies]
# DeepSurv 可选模型（docs/20 R2：镜像变体 cdap-worker-full 才安装）
deepsurv = [
    "torch~=2.4",
    "pycox~=0.3",
]
dev = [
    "pytest>=8.2,<9",  # pytest 9 生态未就绪（pytest-asyncio/schemathesis 全线 cap <9）；PYSEC-2026-1845 为测试工具漏洞，CI pip-audit 以 --ignore-vuln PYSEC-2026-1845 豁免并每季度复核
    "pytest-asyncio>=0.24",
    "anyio>=4.8",
    "hypothesis~=6.112",
    "coverage~=7.6",
    "ruff~=0.6",
    "mypy~=1.11",
    "pandas-stubs~=2.2",
    "import-linter~=2.0",
    "schemathesis~=3.35",
    "testcontainers~=4.8",
    "pip-audit~=2.7",
    "pip-licenses~=5.0",
    "locust~=2.31",
    # 本地调试：VS Code attach 断点（deploy/docker-compose.dev.yml 的 5678/5679 端口）
    "debugpy~=1.8",
    # Celery worker 代码变更自动重启（watchfiles CLI 包裹 celery 命令）
    "watchfiles~=0.24",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# ---------- T0.1 代码质量配置（DoD: CI 中全部可运行且通过） ----------

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "ASYNC", "RUF"]
ignore = [
    "S101",  # assert 在测试中允许
    "RUF001", "RUF002", "RUF003",  # 中文注释/docstring 允许全角标点
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "B008"]
"alembic/**" = ["E501"]
"app/api/**" = ["B008"]  # FastAPI Depends 惯用法
"app/schemas/**" = ["S105"]  # token_type 字段名误报
"app/core/config.py" = ["S105"]  # 开发默认值，生产经环境变量覆盖（docs/12 §2.1）

[tool.mypy]
python_version = "3.11"
mypy_path = "."
packages = ["app"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery.*", "minio.*", "redbeat.*", "sklearn.*", "simpleeval", "simpleeval.*", "sksurv.*", "lifelines.*", "catboost.*", "torch", "torch.*", "pycox.*", "torchtuples.*", "shap", "shap.*", "pygam", "pygam.*", "weasyprint", "weasyprint.*", "statsmodels", "statsmodels.*", "scipy", "scipy.*", "openai"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.workers.*"]
disallow_untyped_decorators = false  # celery task 装饰器无类型存根

[[tool.mypy.overrides]]
module = ["redis.asyncio", "redis.asyncio.*"]
disallow_untyped_calls = false

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "engines 禁止依赖 web/任务框架（docs/12 §1 分层纪律）"
type = "forbidden"
source_modules = ["app.engines"]
forbidden_modules = ["fastapi", "celery", "sqlalchemy"]

[[tool.importlinter.contracts]]
name = "api 禁止直接操作 ORM（必须经 services）"
type = "forbidden"
source_modules = ["app.api"]
forbidden_modules = ["app.models"]
allow_indirect_imports = true  # 只禁止直接 import；api→services→models 为合法路径

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.coverage.run]
source = ["app"]
omit = [
    "app/plugins/*",
    "app/models/*",   # 由 T0.4 迁移验证 + M1 集成测试覆盖
    "app/workers/*",  # 由 M2 编排集成测试覆盖
    "app/scripts/*",  # 运维脚本，由 compose 内手工执行验证
]

[tool.coverage.report]
fail_under = 70  # M0 骨架阶段；M1 起按 docs/19 提至 80


[project.entry-points."cdap.models"]
# 内置模型插件在此注册（docs/15），实现后取消注释：
dummy = "app.plugins.builtin.dummy:DummyAdapter"
km = "app.plugins.builtin.survival:KmAdapter"
coxph = "app.plugins.builtin.survival:CoxphAdapter"
rsf = "app.plugins.builtin.survival:RsfAdapter"
gbs = "app.plugins.builtin.survival:GbsAdapter"
logreg = "app.plugins.builtin.classification:LogregAdapter"
rf = "app.plugins.builtin.classification:RfClassifierAdapter"
svm = "app.plugins.builtin.classification:SvmAdapter"
xgboost = "app.plugins.builtin.classification:XgboostAdapter"
lightgbm = "app.plugins.builtin.classification:LightgbmAdapter"
catboost = "app.plugins.builtin.classification:CatboostAdapter"
lasso = "app.plugins.builtin.regression:LassoAdapter"
elasticnet = "app.plugins.builtin.regression:ElasticnetAdapter"
rf_reg = "app.plugins.builtin.regression:RfRegressorAdapter"
xgboost_reg = "app.plugins.builtin.regression:XgboostRegressorAdapter"
deepsurv = "app.plugins.builtin.deepsurv:DeepsurvAdapter"
poisson = "app.plugins.builtin.poisson_models:PoissonAdapter"
negbin = "app.plugins.builtin.poisson_models:NegativeBinomialAdapter"
gam = "app.plugins.builtin.gam_models:GAMAdapter"
gee = "app.plugins.builtin.gee_models:GEEAdapter"
dlnm = "app.plugins.builtin.dlnm_models:DLNMAdapter"
