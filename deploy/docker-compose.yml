# docs/21 §2；密钥一律经 .env 注入（见 .env.example），禁止提交真实值
name: cdap

services:
  caddy:
    image: caddy:2-alpine
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN to your HTTPS domain}
      STORAGE_DOMAIN: ${STORAGE_DOMAIN:?set STORAGE_DOMAIN to your HTTPS storage domain}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      frontend:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ../frontend
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ../backend
      target: prod
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-prod}
      DATABASE_URL: postgresql+psycopg://cdap:${PG_PASSWORD:?need PG_PASSWORD}@postgres:5432/cdap
      REDIS_URL: redis://:${REDIS_PASSWORD:?need REDIS_PASSWORD}@redis:6379/0
      STORAGE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: cdap
      S3_ACCESS_KEY: ${MINIO_APP_USER:?need MINIO_APP_USER}
      S3_SECRET_KEY: ${MINIO_APP_PASSWORD:?need MINIO_APP_PASSWORD}
      S3_SECURE: "false"
      # 预签名下载按浏览器可达端点签名（host 计入 SigV4，docs/12 §2.4）
      S3_PUBLIC_ENDPOINT: https://${STORAGE_DOMAIN:?need STORAGE_DOMAIN}
      JWT_SECRET: ${JWT_SECRET:?}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      COOKIE_SECURE: "true"
      # LLM 部署层（T6.6；运行层策略/开关/key 在管理员「AI 设置」页调整）
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      LLM_CLOUD_ENABLED: ${LLM_CLOUD_ENABLED:-false}
      LLM_DEFAULT_CHOICE: ${LLM_DEFAULT_CHOICE:-auto}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?need SETTINGS_ENCRYPTION_KEY}
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: ../backend
      target: prod
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    command: celery -A app.workers.celery_app worker -Q default,model,report --concurrency=4
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-prod}
      DATABASE_URL: postgresql+psycopg://cdap:${PG_PASSWORD}@postgres:5432/cdap
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      STORAGE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: cdap
      S3_ACCESS_KEY: ${MINIO_APP_USER}
      S3_SECRET_KEY: ${MINIO_APP_PASSWORD}
      S3_SECURE: "false"
      S3_PUBLIC_ENDPOINT: https://${STORAGE_DOMAIN}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: "true"
      # worker 执行报告解读等 LLM 任务，需同一份部署层配置（T6.6）
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      LLM_CLOUD_ENABLED: ${LLM_CLOUD_ENABLED:-false}
      LLM_DEFAULT_CHOICE: ${LLM_DEFAULT_CHOICE:-auto}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY}
    deploy:
      resources:
        limits:
          memory: 6G
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build:
      context: ../backend
      target: prod
    command: celery -A app.workers.celery_app beat
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-prod}
      DATABASE_URL: postgresql+psycopg://cdap:${PG_PASSWORD}@postgres:5432/cdap
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      STORAGE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: cdap
      S3_ACCESS_KEY: ${MINIO_APP_USER}
      S3_SECRET_KEY: ${MINIO_APP_PASSWORD}
      S3_PUBLIC_ENDPOINT: https://${STORAGE_DOMAIN}
      S3_SECURE: "false"
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # 可选本地 LLM（T6.6）：docker compose --profile llm up -d ollama 启动；
  # 首次需拉取模型：docker compose exec ollama ollama pull ${OLLAMA_MODEL:-qwen2.5:7b}
  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    volumes:
      - ollamadata:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 8G
    restart: unless-stopped

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: cdap
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: cdap
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdap"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?need REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?need MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?need MINIO_ROOT_PASSWORD}
      MINIO_APP_USER: ${MINIO_APP_USER:?need MINIO_APP_USER}
      MINIO_APP_PASSWORD: ${MINIO_APP_PASSWORD:?need MINIO_APP_PASSWORD}
    volumes:
      - ./minio-policy.json:/policy.json:ro
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        set -eu;
        mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
        mc mb --ignore-existing local/cdap;
        mc admin policy detach local cdap-app-policy --user $$MINIO_APP_USER || true;
        mc admin policy remove local cdap-app-policy || true;
        mc admin policy create local cdap-app-policy /policy.json;
        mc admin user add local $$MINIO_APP_USER $$MINIO_APP_PASSWORD || true;
        mc admin policy attach local cdap-app-policy --user $$MINIO_APP_USER
    restart: "no"

  migrate:
    build:
      context: ../backend
      target: prod
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    command: alembic upgrade head
    environment:
      # 迁移容器只需要数据库，不启动应用配置的生产存储校验。
      ENVIRONMENT: dev
      DATABASE_URL: postgresql+psycopg://cdap:${PG_PASSWORD}@postgres:5432/cdap
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
  redisdata:
  miniodata:
  ollamadata:
  caddy_data:
  caddy_config:
